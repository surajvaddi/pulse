name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pulseshift:pulseshift@localhost:5432/pulseshift?schema=public
      DIRECT_URL: postgresql://pulseshift:pulseshift@localhost:5432/pulseshift?schema=public
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      API_HOST: 127.0.0.1
      API_PORT: "4000"
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: local-anon-key
      SUPABASE_SERVICE_ROLE_KEY: local-service-role-key
      SUPABASE_JWT_SECRET: local-jwt-secret
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-anon-key
      AI_GATEWAY_BASE_URL: ""
      AI_GATEWAY_API_KEY: ""
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulseshift
          POSTGRES_PASSWORD: pulseshift
          POSTGRES_DB: pulseshift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseshift -d pulseshift"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:ai-routing
      - run: npm run test:demo
      - run: npm run build --workspace @pulseshift/api
      - run: npm run start --workspace @pulseshift/api &
      - run: npx wait-on http://127.0.0.1:4000/health
      - run: npm run build
      - run: npm audit --audit-level=high
