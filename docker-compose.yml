services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseshift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulseshift
      POSTGRES_PASSWORD: pulseshift
      POSTGRES_DB: pulseshift
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseshift -d pulseshift"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulseshift-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
